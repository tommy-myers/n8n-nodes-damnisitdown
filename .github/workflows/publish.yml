# Publishes n8n-nodes-damnisitdown to npm with a provenance statement whenever
# a version tag (for example 0.1.1) is pushed. Based on n8n-io/n8n-nodes-starter.
#
# Auth: npm Trusted Publishing (OIDC). On npmjs.com the package's
# Settings -> Trusted Publisher is set to GitHub Actions with
#   owner: tommy-myers  repo: n8n-nodes-damnisitdown  workflow: publish.yml
# No NPM_TOKEN secret is needed. If one is ever set, it is used instead.
#
# Release: bump "version" in package.json, commit to main, then
#   git tag 0.1.1 && git push origin 0.1.1

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Needed to mint the OIDC token for trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@latest && npm --version

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Release
        # n8n-node release (in CI) runs lint, build, then `npm publish` with
        # NPM_CONFIG_PROVENANCE=true.
        run: |
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
